name: Portal regression
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  portal-safety:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - run: npm ci --prefix tests/portal-safety --ignore-scripts --no-audit --no-fund
      - name: Check both portal scripts
        run: |
          node --check dashboard.js
          node --check portal-enterprise.js
          node --check security.js
          node --check directory.js
          node --check device.js
          node --check webex.js
          node --check webex-enterprise-analytics.js
          node --check webex-report-health.js
          node --check webex-integrated-chat.js
          node --check webex-reports.js
          node --check webex-channel-activity.js
          node --check webex-voice-statistics.js
          node --check webex-agent-indicators.js
          node --check webex-abandoned-callback-settings.js
          node --check callback-settings/policy.mjs
          node --check callback-settings/gateway.mjs
          node --check callback-settings/store.mjs
          node --check callback-settings/native.mjs
          node --check callback-settings/execution.mjs
          node --check webex-abandoned-selection.js
          node --check callback-settings/selection.mjs
          node --check callback-settings/plans.mjs
          node --check callback-settings/planning-gateway.mjs
          node --check callback-settings/readiness.mjs
          node --check callback-settings/workspace.mjs
          node --check callback-settings/management.mjs
          node --check callback-settings/outcomes.mjs
          node --check callback-settings/automation.mjs
          node --check callback-settings/maintenance.mjs
          node --check callback-settings/management-ui.mjs
          node --check callback-settings/work-index.mjs
          node --check callback-settings/flow-policy.mjs
          node --check callback-settings/reservations.mjs
          node --check webex-abandoned-selection.js
          node --check device-management/audit.mjs
          node --check device-management/contracts.mjs
          node --check device-management/gateway.mjs
          node --check device-management/identity.mjs
          node --check device-management/lease.mjs
          node --check device-management/phonism.mjs
          node --check device-management/write.mjs
          node --check device-management/phone-selfservice.mjs
          node --check scripts/release-yealink-fast-save-r2.mjs
          node --check scripts/release-yealink-save-wait-screen.mjs
          node --check scripts/release-yealink-reboot-message.mjs
      - name: Run request, roster, privacy and failure-isolation tests
        env:
          ACORN_MODULE: ${{ github.workspace }}/tests/portal-safety/node_modules/acorn/dist/acorn.mjs
        run: node --test tests/dashboard-audit/*.test.mjs tests/dashboard-lifecycle/*.test.mjs tests/abandoned-callback-settings/*.test.mjs tests/portal-safety/policy.test.mjs tests/channel-activity/*.test.mjs tests/voice-statistics/*.test.mjs tests/chat-agent-presentation.test.mjs tests/agent-indicators.test.mjs tests/agent-queue-state-r3.test.mjs tests/security-console-v2.test.mjs tests/security-lifecycle-v3.test.mjs tests/enterprise-analytics-trends.test.mjs tests/abandoned-followup-correlation.test.mjs tests/webex-queue-alert-parity.test.mjs tests/enterprise-portal-shell.test.mjs tests/enterprise-ui-consistency.test.mjs tests/browser-security-r2.test.mjs tests/security-access-regression-r6.test.mjs tests/security-hardening-r5.test.mjs tests/device-management/*.test.mjs
# No deployment, Cloudflare tokens, production requests, or repository writes.
# The exact private production Worker/binding checks run in the guarded uploader.
