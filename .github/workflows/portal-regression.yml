name: Portal regression
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  portal-safety:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - run: npm ci --prefix tests/portal-safety --ignore-scripts --no-audit --no-fund
      - name: Check both portal scripts
        run: |
          node --check dashboard.js
          node --check webex.js
          node --check webex-integrated-chat.js
          node --check webex-reports.js
          node --check webex-channel-activity.js
          node --check webex-voice-statistics.js
          node --check webex-agent-indicators.js
          node --check webex-abandoned-callback-settings.js
          node --check callback-settings/policy.mjs
          node --check callback-settings/gateway.mjs
          node --check callback-settings/store.mjs
      - name: Run request, roster, privacy and failure-isolation tests
        env:
          ACORN_MODULE: ${{ github.workspace }}/tests/portal-safety/node_modules/acorn/dist/acorn.mjs
        run: node --test tests/abandoned-callback-settings/*.test.mjs tests/portal-safety/policy.test.mjs tests/channel-activity/*.test.mjs tests/voice-statistics/*.test.mjs tests/chat-agent-presentation.test.mjs tests/agent-indicators.test.mjs tests/agent-queue-state-r3.test.mjs
# No deployment, Cloudflare tokens, production requests, or repository writes.
# The exact private production Worker/32-binding checks run in the guarded uploader.
